name: Generate Snake

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-snake.svg?color_snake=#7BC9A6&color_dots=#f2f4f8,#e6e9f6,#cfd6f5,#a8b7f0,#8b7cf6
            dist/github-snake-dark.svg?color_snake=#494d7e&color_dots=#161b22,#22302b,#2d4a42,#459d89,#7dd3b0

      - name: Push generated files
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update snake animation"
          add: "dist"
