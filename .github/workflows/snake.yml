name: Generate Snake

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5FD3A5&color_dots=#F5F3FF,#DDD6FE,#C4B5FD,#A78BFA,#8B5CF6
            dist/github-snake-dark.svg?color_snake=#C084FC&color_dots=#161B22,#3B3154,#59477A,#8066B5,#A98BE8

      - name: Configure git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Push generated files
        run: |
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update snake animation"
            git push
          fi
